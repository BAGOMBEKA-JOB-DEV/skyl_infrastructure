name: Security

# Static analysis of the infrastructure itself.
#
# Findings go to GitHub code scanning as SARIF rather than only to the job log,
# so they are triageable and a suppression is a recorded decision rather than a
# scroll past red text.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly. New rules ship constantly and unchanged code can start failing —
    # which is the point; the risk changed even though the config did not.
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkov:
    name: checkov
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Run from pip rather than bridgecrewio/checkov-action.
      #
      # The action was pinned by SHA, as everything here is, and that pin turned
      # out to run `docker://bridgecrew/checkov:2.0.930` — a 2021 image — while
      # carrying a v12 tag. It also rejects `output_file_path`, so no SARIF was
      # written and the upload step failed on a missing file. Pinning the tool
      # instead of the wrapper makes the version visible and the output path
      # ours to choose.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: install checkov
        run: pip install --disable-pip-version-check "checkov==${CHECKOV_VERSION}"
        env:
          CHECKOV_VERSION: "3.3.9"

      # --soft-fail: findings must not fail the build. Checkov's rules assume a
      # generic workload and flag several deliberate decisions here — the public
      # API endpoint, the single NAT gateway, the absent CPU limit — each argued
      # in a comment where it is made. They still reach code scanning, which is
      # where a suppression can be recorded as a decision rather than a silence.
      #
      # The directory is scanned with .terraform skipped: the AWS module pulls
      # in the community VPC and EKS modules, and their findings are not
      # actionable from this repository — fixing them means forking upstream.
      #
      # On the output flags, which are fiddlier than they look. Three forms were
      # tried against checkov 3.3.9 directly:
      #
      #   -o sarif > file                     writes the ASCII banner into the
      #                                       file first, so it is not valid JSON
      #   --output cli --output sarif
      #     --output-file-path console,DIR    silently writes nothing at all
      #   --output sarif
      #     --output-file-path DIR            works
      #
      # Note the filename the working form produces: `results_sarif.sarif`, not
      # `results.sarif`. Assuming the latter is what made this job fail twice.
      - name: checkov
        run: |
          mkdir -p checkov-out
          checkov \
            --config-file .checkov.yaml \
            --directory . \
            --framework terraform kubernetes helm github_actions \
            --output sarif \
            --output-file-path checkov-out \
            --soft-fail

      # SARIF only reaches the Security tab, which nobody opens while watching a
      # PR. Print the count so the job log says something on its own.
      - name: summarise
        if: always()
        run: |
          f=checkov-out/results_sarif.sarif
          if [ ! -f "$f" ]; then echo "::error::checkov produced no SARIF at $f"; exit 1; fi
          python - "$f" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          n = sum(len(r.get("results", [])) for r in d.get("runs", []))
          print(f"checkov: {n} finding(s) — see the Security tab, category 'checkov'")
          PY

      - uses: github/codeql-action/upload-sarif@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e # v3
        if: always()
        with:
          sarif_file: checkov-out/results_sarif.sarif
          category: checkov

  trivy:
    name: trivy config
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          # Findings go to code scanning, not to a build failure. Note this
          # does NOT stop the "Trivy" code-scanning check from going red: that
          # gate fires on new alerts regardless of this step's exit code, which
          # is why every remaining finding carries an inline `#trivy:ignore:`
          # with a justification rather than being left to accumulate.
          exit-code: "0"
          # Downloaded community modules. A fresh CI checkout has no
          # .terraform/, so this changes nothing here — it exists so a local
          # run after `terraform init` reports the same findings CI does,
          # instead of ~60 extra hits from the EKS module's example manifests.
          skip-dirs: "**/.terraform"
          # policy/fixtures/violations.yaml is a deliberately broken manifest.
          # Conftest is asserted to REJECT it in manifests.yml; Trivy flagging
          # its 16 planted defects is correct and entirely uninteresting, and
          # leaving it in would bury real findings under known ones.
          skip-files: "policy/fixtures/violations.yaml"
          trivy-config: trivy.yaml

      - uses: github/codeql-action/upload-sarif@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e # v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy

  # Nothing in this repository should contain a credential. The clouds are
  # reached by OIDC federation and the gateway's secrets live in the cloud
  # secret stores — so any hit here is either a real leak or a test fixture
  # that should not look like one.
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
