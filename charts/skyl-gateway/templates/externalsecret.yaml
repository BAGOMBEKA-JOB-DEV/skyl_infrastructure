{{- if and .Values.secrets.externalSecrets.enabled (not .Values.secrets.existingSecret) }}
{{- $es := .Values.secrets.externalSecrets }}
# Provider API keys and the gateway bearer token, synced from the cloud's own
# secret store.
#
# One CRD covers AWS Secrets Manager, GCP Secret Manager and Azure Key Vault —
# the difference is entirely in the ClusterSecretStore that Terraform creates,
# which is why this file has no provider conditional. Nothing secret is in git
# or in Terraform state.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "skyl-gateway.fullname" . }}
  labels:
    {{- include "skyl-gateway.labels" . | nindent 4 }}
spec:
  # The gateway reads its environment once, at startup. A refresh here rewrites
  # the Secret but does not restart the pods, so a rotated key does not take
  # effect until the next rollout — deliberately, since a mid-flight credential
  # swap would fail in-progress requests.
  #
  # Rotate without downtime using SKYL_AUTH_TOKENS, which accepts several
  # labelled tokens at once. See docs/runbook.md.
  refreshInterval: {{ $es.refreshInterval }}

  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}

  target:
    name: {{ include "skyl-gateway.fullname" . }}
    creationPolicy: Owner
    # Absent until every key below resolves. A partial Secret would start the
    # gateway with some providers missing and no error — the failure mode this
    # avoids is a fleet that looks healthy while silently serving fewer
    # providers than intended.
    deletionPolicy: Retain

  data:
    {{- range $es.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteKey }}
        {{- with .property }}
        property: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
