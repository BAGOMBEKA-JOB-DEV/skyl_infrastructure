{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "skyl-gateway.serviceAccountName" . }}
  labels:
    {{- include "skyl-gateway.labels" . | nindent 4 }}
    {{- with .Values.serviceAccount.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.serviceAccount.annotations }}
  # Workload identity. Terraform emits the right key for the target cloud —
  # eks.amazonaws.com/role-arn, iam.gke.io/gcp-service-account, or
  # azure.workload.identity/client-id — and the environment passes it through
  # verbatim. That indirection is what keeps this chart free of provider
  # conditionals.
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The gateway calls no Kubernetes API and no cloud API. Secrets reach it as a
# plain Secret that External Secrets Operator has already materialised, and ESO
# authenticates to the cloud with its own identity, not this one. So there is
# nothing for a projected token to be used for, and mounting one would hand a
# compromised process a credential it has no need of.
#
# The consequence, which is easy to trip over: the workload-identity annotation
# above is inert while this is false. It is emitted so the ServiceAccount is
# recognisable to a cloud IAM binding, not because the pod federates with it.
# If you ever add a code path that calls a cloud API directly, this must become
# true or the SDK will fail to find credentials.
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
{{- end }}
