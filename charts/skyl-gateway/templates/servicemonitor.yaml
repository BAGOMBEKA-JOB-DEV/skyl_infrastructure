{{- if .Values.serviceMonitor.enabled }}
{{- if not .Values.config.metrics }}
{{- fail "serviceMonitor.enabled requires config.metrics=true, otherwise /metrics is not served and every scrape 404s" }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "skyl-gateway.fullname" . }}
  labels:
    {{- include "skyl-gateway.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "skyl-gateway.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
{{- end }}
